[Partition]
Type=esp
Format=vfat
CopyFiles=/boot/EFI/aemeath:/EFI/aemeath
CopyFiles=/boot/EFI/BOOT:/EFI/BOOT
CopyFiles=/boot/EFI/systemd:/EFI/systemd
CopyFiles=/boot/EFI/Linux/aemeath_%w.efi:/EFI/Linux/aemeath_%w.efi
CopyFiles=/boot/loader/loader.conf:/loader/loader.conf
CopyFiles=/boot/loader/keys:/loader/keys
SizeMinBytes=1G
SizeMaxBytes=1G
